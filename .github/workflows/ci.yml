name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify installable build
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
      - name: Upload installable plugin build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-english-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
